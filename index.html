<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gutter Guys of Katy</title>
<meta name="description" content="Gutter Guys">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b5fa5">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="site-nav-wrapper">
    <header id="site-header">
      <a class="site-brand" href="#home">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-5h6v5"/></svg>
        Gutter Guys
      </a>
      <div class="site-actions">
        <a class="site-phone" href="tel:+13465560660">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>
          <span>(346) 556-0660</span>
        </a>
        <a class="site-btn site-btn-primary" href="#rfq">Free Quote</a>
        <div class="account-menu" id="account-menu">
          <button type="button" class="site-btn site-btn-ghost" id="site-login-btn" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu-dropdown">
            <span aria-hidden="true">👤</span><span class="site-login-label">Login</span>
          </button>
          <div class="account-menu-dropdown" id="account-menu-dropdown" hidden>
            <div class="account-menu-modules" id="site-subnav-inner"></div>
            <div class="account-menu-divider"></div>
            <a class="account-menu-item" href="#profile">Profile</a>
            <a class="account-menu-item" href="#account">Account</a>
            <button type="button" class="account-menu-item account-menu-logout" id="account-menu-logout">Log out</button>
          </div>
        </div>
      </div>
    </header>
  </div>

  <main id="app" aria-live="polite">
    <p class="loading">Loading&hellip;</p>
  </main>


  <div id="toast" class="toast" role="status" hidden></div>

  <div id="login-modal" class="login-modal" hidden>
    <div class="login-modal-backdrop" id="login-modal-backdrop"></div>
    <div class="login-modal-card" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
      <button type="button" class="login-modal-close" id="login-modal-close" aria-label="Close">&times;</button>
      <h2 id="login-modal-title">Log in</h2>

      <form id="login-email-form" class="login-step">
        <p class="login-hint">We'll email you a one-time code. No password needed.</p>
        <label class="login-field">
          <span>Email</span>
          <input type="email" id="login-email-input" required autocomplete="email" placeholder="you@example.com">
        </label>
        <button type="submit" class="site-btn site-btn-primary login-submit">Continue</button>
        <p class="login-error" id="login-email-error" hidden></p>
      </form>

      <form id="login-register-form" class="login-step" hidden>
        <p class="login-hint">We don't have an account for <strong id="login-register-email"></strong> yet - tell us a bit about you and we'll email a one-time code.</p>
        <label class="login-field">
          <span>Name</span>
          <input type="text" id="login-register-name" required autocomplete="name" placeholder="Jane Doe">
        </label>
        <label class="login-field">
          <span>Phone</span>
          <input type="tel" id="login-register-phone" autocomplete="tel" placeholder="(346) 556-0660">
        </label>
        <label class="login-field">
          <span>Address</span>
          <input type="text" id="login-register-address" autocomplete="street-address" placeholder="123 Main St, Katy, TX">
        </label>
        <button type="submit" class="site-btn site-btn-primary login-submit">Create account &amp; send code</button>
        <div class="login-links">
          <button type="button" class="login-link" id="login-register-change-email-btn">Use a different email</button>
        </div>
        <p class="login-error" id="login-register-error" hidden></p>
      </form>

      <form id="login-code-form" class="login-step" hidden>
        <p class="login-hint">Enter the code we emailed to <strong id="login-code-email"></strong>.</p>
        <label class="login-field">
          <span>Code</span>
          <input type="text" id="login-code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code" placeholder="123456">
        </label>
        <button type="submit" class="site-btn site-btn-primary login-submit">Verify &amp; log in</button>
        <div class="login-links">
          <button type="button" class="login-link" id="login-resend-btn">Resend code</button>
          <button type="button" class="login-link" id="login-change-email-btn">Use a different email</button>
        </div>
        <p class="login-error" id="login-code-error" hidden></p>
      </form>
    </div>
  </div>

  <footer id="site-footer">
    <h6>&copy; <span id="year"></span> Gutter Guys of Katy</h6>
  </footer>

  <script src="config.js"></script>
  <script src="assets/js/gutter-tools.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
