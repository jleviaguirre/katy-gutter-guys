<!--
  Account module - the landing page for a logged-in user's own area, a
  simple menu of cards pointing at other modules (same idea as the
  Masthead/menu-bar row on home.html, just account-scoped). Paste this
  ENTIRE block into the "html" column of the Modules sheet, on a row with
  module = account (role can stay blank - renderAccountRoute in app.js
  already requires a logged-in session for #account/#profile on its own).

  Add/remove cards here to match whatever modules you actually have. Ships
  with Quotes and New Survey (both working - the latter links to
  docs/modules/gutter-survey.html, assumed pasted at module = survey), plus
  Activity/Invoices placeholders you can point at your own modules later
  (or delete the cards if you don't need them yet).
-->
